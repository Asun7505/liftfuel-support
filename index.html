  <style>:root{color-scheme:light;--paper:#edeee7;--ink:#183e32;--muted:#68776b;--line:#bec7b933;--accent:#8b9e73;--lime:#dce9ac;--mono:"Cascadia Code",Consolas,"Courier New",monospace;font-family:Inter,"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
body.is-reading{overflow:hidden}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:300px;overflow-x:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #4d7765;outline-offset:5px}button{border:0;background:none}a,button{touch-action:manipulation}::selection{background:#c8d9a7;color:#183e32}.skip-link{position:fixed;left:16px;top:-100px;background:var(--ink);color:var(--paper);padding:12px 18px;z-index:20}.skip-link:focus{top:12px}
#motion-field{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.background-word{position:fixed;right:-.045em;top:-.19em;font-size:clamp(420px,70vw,1100px);line-height:1;font-weight:800;letter-spacing:-.12em;color:#173e3205;pointer-events:none;user-select:none;z-index:0}.site-shell{position:relative;z-index:1;width:min(1440px,100%);margin:auto;padding:0 42px}.site-header{height:92px;border-bottom:1px solid #2b4d3526;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px;letter-spacing:-1.4px}.brand img{width:38px;height:38px;border-radius:11px}.brand-dot{color:#8ca471}.page-nav{display:flex;align-items:center;gap:30px;font-size:13px}.page-nav a{min-height:44px;display:inline-flex;align-items:center;position:relative;opacity:.55}.page-nav a::after{content:"";height:1px;background:var(--ink);position:absolute;bottom:8px;left:0;right:0;transform:scaleX(0);transform-origin:left;transition:transform .3s}.page-nav a[aria-current=page],.page-nav a:hover{opacity:1}.page-nav a[aria-current=page]::after{transform:scaleX(1)}.study-label{font:9px var(--mono);letter-spacing:.5px;display:flex;gap:8px;align-items:center;color:#63735f}.status-dot{width:5px;height:5px;display:inline-block;border-radius:50%;background:#78895f}
.hero{display:grid;grid-template-columns:48% 52%;align-items:center;min-height:calc(100svh - 218px);position:relative}.hero-copy{position:relative;padding:52px 0 40px;z-index:2;transition:opacity .22s,transform .35s cubic-bezier(.2,.8,.2,1),filter .22s}.hero-copy.is-changing{opacity:0;transform:translateY(14px);filter:blur(3px)}.eyebrow{font:10px var(--mono);letter-spacing:1.2px;display:flex;gap:20px;align-items:center;color:#63765e;margin-bottom:30px}h1{font-size:clamp(44px,5vw,78px);line-height:1.2;letter-spacing:-3px;font-weight:650;margin:0 0 24px}h1 span{display:block}h1 span:last-child{color:#627d57}.hero-description{font-size:13px;line-height:1.95;color:#586b5d;margin:0 0 26px;max-width:350px}.hero-actions{display:flex;align-items:center;gap:25px;flex-wrap:wrap}.button{min-height:48px;display:inline-flex;align-items:center;justify-content:space-between;gap:32px;padding:0 20px;font-size:12px;border-radius:3px}.button-dark{background:var(--ink);color:#f4f4e8;border:1px solid var(--ink);transition:background .25s,transform .25s}.button-dark:hover{background:#2c5544;transform:translateY(-2px)}.button-dark>span:last-child{font-size:20px;font-weight:400}.text-link{font-size:12px;display:inline-flex;min-height:44px;align-items:center;gap:12px;border-bottom:1px solid transparent;transition:border-color .2s}.text-link:hover{border-color:var(--ink)}.contact-email{display:inline-block;font:10px var(--mono);letter-spacing:.15px;color:#65745f;margin-top:20px;padding:8px 0}.contact-email:hover{color:var(--ink)}.editorial-note{display:flex;gap:14px;align-items:flex-start;margin-top:32px}.note-rule{width:26px;height:1px;background:#82966d;display:block;margin-top:10px}.editorial-note p{font-size:11px;line-height:1.9;margin:0;color:#72806c}
.art-zone{position:relative;align-self:stretch;min-width:0;min-height:400px;margin:0;pointer-events:none;display:block}.art-cross{font:20px var(--mono);font-weight:300;color:#8c9c7a;position:absolute}.art-cross-top{top:7%;right:5%}.art-cross-bottom{bottom:14%;left:4%}.art-note{font:9px var(--mono);line-height:1.6;letter-spacing:.8px;color:#84917a;position:absolute}.art-note-top{top:8%;left:13%}.art-note-side{right:0;top:51%;writing-mode:vertical-rl;letter-spacing:3px}.art-zone figcaption{position:absolute;bottom:5%;left:11%;right:4%;display:flex;gap:22px;align-items:center;font:9px var(--mono);letter-spacing:.5px;color:#718169;border-top:1px solid #1c422b29;padding-top:14px}.figure-index{color:#325640}.figure-arrow{margin-left:auto;font-size:20px;color:#527247}
.site-footer{padding:22px 0 15px;border-top:1px solid #2b4d3526}.motion-controls{display:flex;gap:28px;align-items:center}.control-label{font-size:10px;letter-spacing:1px;color:#7a8a71}.scene-options{display:flex;gap:5px;align-items:center}.scene-button{font-size:12px;min-height:40px;padding:0 14px;position:relative;border:1px solid transparent;border-radius:3px;transition:background .2s,border-color .2s}.scene-button span{font:9px var(--mono);color:#7c8e71;margin-right:6px}.scene-button.is-selected{background:#dce4cf99;border-color:#c3cfb3}.scene-button:hover{background:#e1e7d7}.pause-button{margin-left:auto;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:11px;color:#58704f}.pause-button>span:first-child{font:13px var(--mono);min-width:12px}.footer-meta{display:flex;justify-content:space-between;gap:16px;margin-top:15px;font-size:9px;line-height:1.8;color:#87917e}.footer-meta>span:last-child{font-family:var(--mono);font-size:9px}
dialog{margin:12px 12px 12px auto;padding:0;width:min(720px,calc(100vw - 24px));height:calc(100dvh - 24px);max-width:none;max-height:none;border:1px solid #e5e8da;border-radius:16px;background:#f7f7ef;color:var(--ink);box-shadow:0 24px 90px #0c20184d;overflow:hidden}dialog::backdrop{background:#0f251b5e;backdrop-filter:blur(8px)}dialog[open]{animation:reader-in .42s cubic-bezier(.2,.8,.2,1)}.reader-shell{height:100%;display:flex;flex-direction:column}.reader-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 30px 20px;border-bottom:1px solid #aebba749}.reader-eyebrow{font:9px var(--mono);letter-spacing:1px;color:#7a8c6f}.reader-header h2{font-size:23px;line-height:1.4;letter-spacing:-.5px;margin:7px 0 0}.close-reader{min-height:44px;min-width:64px;display:flex;gap:14px;align-items:center;justify-content:flex-end;font-size:12px}.close-reader>span{font-size:23px;color:#69855d}.reader-content{padding:8px 30px 30px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#b6c2a9 transparent;line-height:1.95;font-size:14px}.reader-content h1{font-size:23px;margin:24px 0 12px;line-height:1.4;letter-spacing:0}.reader-content h2{font-size:17px;line-height:1.6;margin:27px 0 10px;color:#234c36;font-weight:650}.reader-content p{margin:10px 0 16px;color:#52674f}.reader-content a{color:#2c593c;text-decoration:underline;text-decoration-color:#9cac86;text-underline-offset:4px;overflow-wrap:anywhere}.reader-content section{border-bottom:1px solid #c8d0bd77;padding-bottom:14px}.reader-content strong{font-weight:600}.reader-footer{padding:15px 30px;border-top:1px solid #b3c1a544;display:flex;gap:14px;justify-content:space-between;font-size:10px;color:#718169}.reader-footer a{color:var(--ink)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@keyframes reader-in{from{transform:translateX(50px);opacity:.25}to{transform:translateX(0);opacity:1}}

  <noscript><section id="full-document" class="fallback-document"><h2>支援與常見問題</h2>

<p>記錄飲食、熱量、營養及體重，了解自己的日常趨勢。</p>
<section><h2>聯絡我們</h2><p>支援電郵：<strong><a href="mailto:ryo.studio@outlook.com">ryo.studio@outlook.com</a></strong></p>
<p>使用問題、錯誤回報、功能建議或私隱查詢，請透過上述電郵聯絡。</p>
<p>請提供 iPhone 型號、iOS 版本、LiftFuel 版本、操作步驟及錯誤訊息。截圖請先遮蓋敏感資料；毋須提供密碼或完整健康紀錄。</p></section>

      ctx.beginPath();
      ribbon.vertices.forEach((vertex, index) => index ? ctx.lineTo(vertex.x, vertex.y) : ctx.moveTo(vertex.x, vertex.y));
      ctx.stroke();
    }
    for (let column = 0; column < ribbons[0].length; column += mobile ? 9 : 7) {
      ctx.strokeStyle = 'rgba(82,115,65,.13)';
      ctx.lineWidth = .55;
      ctx.beginPath();
      ribbons.forEach((ribbon, row) => row ? ctx.lineTo(ribbon[column].x, ribbon[column].y) : ctx.moveTo(ribbon[column].x, ribbon[column].y));
      ctx.stroke();
    }
    for (const vertex of mesh) {
      if (vertex.column % 10 || vertex.row % 3) continue;
      ctx.fillStyle = vertex.depth < 0 ? 'rgba(43,85,54,.48)' : 'rgba(102,137,72,.32)';
      ctx.beginPath();
      ctx.arc(vertex.x, vertex.y, vertex.depth < 0 ? 1 : .65, 0, Math.PI * 2);
      ctx.fill();
    }
    const tagPoints = [
      {label: 'P', point: project(-1.10, -.66, .15, centerX, centerY, scale, rotation), color: '#325e3c'},
      {label: 'F', point: project(1.08, .48, .35, centerX, centerY, scale, rotation), color: '#a48c53'},
      {label: 'C', point: project(.05, 1.06, -.34, centerX, centerY, scale, rotation), color: '#6a8f88'},
    ];
    for (const tag of tagPoints) {
      const x = tag.point.x, y = tag.point.y;
      ctx.strokeStyle = tag.color;
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = tag.color;
      ctx.font = '10px Consolas, monospace';
      ctx.fillText(tag.label, x + 9, y - 7);
    }
    ctx.restore();
  }
  function tick(now) {
    state.frame = 0;
    if (!state.playing || document.hidden || reader.open) return;
    const elapsed = now - state.lastTime;
    if (elapsed >= (smallScreen.matches ? 1000 / 30 : 1000 / 55)) {
      const dt = state.lastTime ? Math.min(elapsed / 1000, .05) : .016;
      state.lastTime = now;
      state.time += dt;
      const easing = Math.min(1, dt * 5);
      state.weights = state.weights.map((weight, index) => weight + ((state.scene === index ? 1 : 0) - weight) * easing);
      state.smoothPointer = state.smoothPointer.map((value, index) => value + (state.pointer[index] - value) * Math.min(1, dt * 3.5));
      paint();
    }
    state.frame = window.requestAnimationFrame(tick);
  }
  function startFrames() {
    if (!context || state.frame || !state.playing || document.hidden || reader.open) return;
    state.lastTime = 0;
    state.frame = window.requestAnimationFrame(tick);
  }
  function stopFrames() {
    if (state.frame) window.cancelAnimationFrame(state.frame);
    state.frame = 0;
    state.lastTime = 0;
  }

  showPage(pageFromPath(), false, true);
  syncMotionControl();
  setScene(state.scene);
  resize();
  startFrames();
})();
</script>
